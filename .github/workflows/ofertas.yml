name: ofertas-cl

on:
  schedule:
    - cron: "17 * * * *"   # tiendas cada hora (UTC; Chile UTC-4/-3)
    - cron: "47 */3 * * *" # vuelos cada 3h
  workflow_dispatch:
    inputs:
      probe:
        description: "Probar bypass de bloqueo Ripley/Paris"
        type: boolean
        default: false

concurrency:
  group: ofertas
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Túnel WireGuard a casa
        env:
          WG_CONF: ${{ secrets.WG_CONF }}
        run: |
          if [ -z "$WG_CONF" ]; then echo "WG_CONF no definido - sin túnel"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard
          umask 077
          printf '%s\n' "$WG_CONF" > /tmp/wg0.conf
          sudo wg-quick up /tmp/wg0.conf
          echo "IP saliente: $(curl -s --max-time 20 https://api.ipify.org || echo 'SIN CONEXION')"

      - name: Sondeo de bloqueo
        run: python probe_block.py

  tiendas:
    if: (github.event_name == 'workflow_dispatch' && !inputs.probe) || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data/ofertas.db
          key: ofertas-db-${{ github.run_id }}
          restore-keys: ofertas-db-

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Túnel WireGuard a casa
        env:
          WG_CONF: ${{ secrets.WG_CONF }}
        run: |
          if [ -z "$WG_CONF" ]; then echo "WG_CONF no definido - sin túnel"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard
          umask 077
          printf '%s\n' "$WG_CONF" > /tmp/wg0.conf
          sudo wg-quick up /tmp/wg0.conf
          echo "IP saliente: $(curl -s --max-time 20 https://api.ipify.org || echo 'SIN CONEXION')"

      - name: Scrapear tiendas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py --no-flights

  vuelos:
    if: (github.event_name == 'workflow_dispatch' && !inputs.probe) || github.event.schedule == '47 */3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore DB
        uses: actions/cache@v4
        with:
          path: data/ofertas.db
          key: ofertas-db-${{ github.run_id }}
          restore-keys: ofertas-db-

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Consultar vuelos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py --flights-only
