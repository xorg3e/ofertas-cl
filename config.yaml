# Umbrales de alerta
thresholds:
  product_drop_pct: 15
  flight_drop_pct: 20
  flight_percentile: 10
  flight_price_max: 270000   # alertar si ida+vuelta baja de este precio (CLP)
  flight_price_min: 150000   # rango objetivo del usuario: 150k-270k

# Rubros del usuario: camas, celulares, notebooks, drones, ropa, maletas,
# perfumes, TV, scooters, powerbank, muebles, iPad, audífonos, relojes,
# zapatillas, smartwatch, smart TV
stores:
  ripley:
    enabled: true
    split_groups: 2        # alterna 2 grupos por hora (WAF rate limit por IP)
    retry_wait: 60         # reintenta URLs 429 tras esperar
    urls:
      - "https://simple.ripley.cl/tecno/celulares"
      - "https://simple.ripley.cl/tecno/computacion/notebooks"
      - "https://simple.ripley.cl/tecno/television/smart-tv"
      - "https://simple.ripley.cl/dormitorio/camas"
      - "https://simple.ripley.cl/belleza/perfumes"
      - "https://simple.ripley.cl/jugueteria-y-ninos/juguetes-infantiles-exterior/drones-y-juguetes-a-control"
  falabella:
    enabled: true
    urls:
      - "https://www.falabella.com/falabella-cl/category/cat70057/Notebooks"
      - "https://www.falabella.com/falabella-cl/category/cat7230062/Drones-y-Accesorios"
      - "https://www.falabella.com/falabella-cl/category/cat7190148/Smart-TV"
      - "https://www.falabella.com/falabella-cl/category/cat16400010/Telefonia"
      - "https://www.falabella.com/falabella-cl/shop/set-de-perfumes"
  hites:
    enabled: true
    urls:
      - "https://www.hites.com/tecnologia/computacion/notebook/"
      - "https://www.hites.com/celulares/smartphones/"
      - "https://www.hites.com/tecnologia/tv-video/televisores-smart-tv/"
      - "https://www.hites.com/tecnologia/fotografia/drones/"
  paris:
    enabled: true
    urls:
      - "https://www.paris.cl/outlet/outlet-electro/outlet-televisores/"
      - "https://www.paris.cl/listas/drone-mavic"
      - "https://www.paris.cl/outlet/outlet-tecno/outlet-celulares/"
      - "https://www.paris.cl/outlet/outlet-tecno/outlet-computadores/"
      - "https://www.paris.cl/outlet/outlet-dormitorio/outlet-camas-y-colchones/"
      - "https://www.paris.cl/outlet/outlet-belleza/outlet-perfumes/"
      - "https://www.paris.cl/belleza/perfumes/"

flights:
  enabled: true
  currency: CLP
  routes:
    - { origin: SCL, destination: GRU, dates: ["2027-04-28", "2027-04-29"], return_date: "2027-05-03" }
  days_ahead_min: 7
  days_ahead_max: 60

# Ofertas error fare de Secret Flying (scrapeo simple, sin navegador)
deals:
  enabled: true
  urls:
    - "https://www.secretflying.com/south-america-flight-deals/"
    - "https://www.secretflying.com/error-fares/"
  keywords: ["santiago", "chile", "brazil", "brasil", "sao paulo", "rio de janeiro", "guarulhos"]

storage:
  path: "data/ofertas.db"
